# Builds and tests the library and dng-convert in the development container,
# the image of docker/Dockerfile, so that CI runs with the same packages as
# `./docker/dock.sh dng-converter exec test.sh` on a developer's machine.
#
# The image's layers are kept in the Actions cache, so the image is only
# rebuilt when the Dockerfile changes. The sample raw files, about 150 MB
# from raw.pixls.us, are cached too, under the hash of bin/fetch-samples.sh,
# which lists them with their checksums: they are downloaded again only when
# that list changes.

name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The container user gets the runner's uid and gid, as dock.sh gives it
      # the host user's, so that it can write to the checked out workspace.
      - name: Read the runner's uid and gid
        id: user
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: dng-converter:ci
          build-args: |
            USER_UID=${{ steps.user.outputs.uid }}
            USER_GID=${{ steps.user.outputs.gid }}
          cache-from: type=gha,scope=dng-converter-image
          cache-to: type=gha,scope=dng-converter-image,mode=max

      - uses: actions/cache@v4
        with:
          path: samples
          key: samples-${{ hashFiles('bin/fetch-samples.sh') }}

      - name: Download the samples
        run: docker run --rm -v "$PWD:/home/developer/ws" dng-converter:ci fetch-samples.sh

      - name: Build and test
        run: docker run --rm -v "$PWD:/home/developer/ws" dng-converter:ci test.sh

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
